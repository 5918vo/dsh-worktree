<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dsh-worktree · Optical Precision</title>
<style>
  :root[data-theme="dark"] {
    --bg-canvas: #09090b;
    --bg-rail: #0d0e11;
    --bg-stage: #101114;
    --bg-elevated: #16181d;
    --bg-modal: #13151a;
    --bg-hover: rgba(255, 255, 255, 0.045);
    --bg-active: rgba(255, 255, 255, 0.075);
    --backdrop: rgba(4, 4, 6, 0.72);

    --line: rgba(255, 255, 255, 0.08);
    --line-strong: rgba(255, 255, 255, 0.16);
    --specular: inset 0 1px 0 rgba(255, 255, 255, 0.07);
    --modal-shadow: 0 24px 64px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08);

    --text-1: #f4f4f5;
    --text-2: #a1a1aa;
    --text-3: #63636e;

    --cta-bg: #f4f4f5;
    --cta-text: #09090b;
    --cta-hover: #ffffff;

    --accent: #818cf8;
    --accent-soft: rgba(129, 140, 248, 0.12);
    --accent-line: rgba(129, 140, 248, 0.28);

    --ok: #34d399;
    --ok-soft: rgba(52, 211, 153, 0.11);
    --ok-line: rgba(52, 211, 153, 0.25);

    --warn: #fbbf24;
    --warn-soft: rgba(251, 191, 36, 0.11);
    --warn-line: rgba(251, 191, 36, 0.26);

    --err: #f87171;
    --err-soft: rgba(248, 113, 113, 0.11);
    --err-line: rgba(248, 113, 113, 0.26);

    --code-bg: #0b0c0f;
    --diff-add-bg: rgba(16, 185, 129, 0.11);
    --diff-del-bg: rgba(244, 63, 94, 0.12);
  }

  :root[data-theme="light"] {
    --bg-canvas: #f2f1ec;
    --bg-rail: #f6f5f0;
    --bg-stage: #fcfbf8;
    --bg-elevated: #ffffff;
    --bg-modal: #fcfbf8;
    --bg-hover: rgba(20, 20, 19, 0.04);
    --bg-active: rgba(20, 20, 19, 0.075);
    --backdrop: rgba(20, 20, 19, 0.36);

    --line: rgba(20, 20, 19, 0.085);
    --line-strong: rgba(20, 20, 19, 0.18);
    --specular: inset 0 1px 0 rgba(255, 255, 255, 0.9);
    --modal-shadow: 0 24px 60px rgba(20, 20, 19, 0.16), 0 0 0 1px rgba(20, 20, 19, 0.09);

    --text-1: #141413;
    --text-2: #575652;
    --text-3: #8c8a82;

    --cta-bg: #141413;
    --cta-text: #fcfbf8;
    --cta-hover: #2a2a28;

    --accent: #4f46e5;
    --accent-soft: rgba(79, 70, 229, 0.09);
    --accent-line: rgba(79, 70, 229, 0.24);

    --ok: #059669;
    --ok-soft: rgba(5, 150, 105, 0.09);
    --ok-line: rgba(5, 150, 105, 0.24);

    --warn: #b45309;
    --warn-soft: rgba(180, 83, 9, 0.09);
    --warn-line: rgba(180, 83, 9, 0.24);

    --err: #dc2626;
    --err-soft: rgba(220, 38, 38, 0.08);
    --err-line: rgba(220, 38, 38, 0.22);

    --code-bg: #f6f5f0;
    --diff-add-bg: rgba(16, 185, 129, 0.10);
    --diff-del-bg: rgba(220, 38, 38, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    font-size: 13px;
    line-height: 1.5;
    color: var(--text-1);
    background: var(--bg-canvas);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .mono {
    font-family: "JetBrains Mono", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, monospace;
    font-variant-numeric: tabular-nums;
  }

  /* 3-Zone Architectural Grid */
  .app {
    display: grid;
    grid-template-columns: 272px minmax(0, 1fr) 284px;
    height: 100vh;
    transition: grid-template-columns .18s cubic-bezier(.2,.8,.2,1);
  }
  .app.hide-left { grid-template-columns: 0 minmax(0, 1fr) 284px; }
  .app.hide-right { grid-template-columns: 272px minmax(0, 1fr) 0; }
  .app.hide-left.hide-right { grid-template-columns: 0 minmax(0, 1fr) 0; }

  /* Left Navigation Rail */
  .rail {
    background: var(--bg-rail);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .rail-top {
    padding: 14px 14px 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .logo-mark {
    width: 18px;
    height: 18px;
    border-radius: 5px;
    background: var(--cta-bg);
    color: var(--cta-text);
    display: grid;
    place-items: center;
    font-size: 11px;
    font-weight: 700;
  }

  .rail-controls {
    padding: 0 12px 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border-bottom: 1px solid var(--line);
  }
  .search-wrap { position: relative; }
  .search {
    width: 100%;
    height: 30px;
    padding: 0 28px 0 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-stage);
    color: var(--text-1);
    font-size: 12px;
    outline: none;
    transition: border-color .15s;
  }
  .search::placeholder { color: var(--text-3); }
  .search:focus { border-color: var(--line-strong); }
  .search-kbd {
    position: absolute;
    right: 7px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    color: var(--text-3);
    padding: 1px 4px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }

  .pills { display: flex; gap: 4px; }
  .pill {
    flex: 1;
    height: 24px;
    border: 1px solid transparent;
    border-radius: 5px;
    background: transparent;
    color: var(--text-3);
    font-size: 11px;
    font-weight: 500;
    cursor: pointer;
    transition: all .12s;
  }
  .pill:hover { color: var(--text-2); background: var(--bg-hover); }
  .pill.active {
    color: var(--text-1);
    background: var(--bg-elevated);
    border-color: var(--line);
    box-shadow: var(--specular);
  }

  .rail-list { flex: 1; overflow-y: auto; padding: 10px 8px; }
  .group-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 8px 4px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
  }
  .item {
    padding: 9px 10px;
    border-radius: 7px;
    border: 1px solid transparent;
    cursor: pointer;
    margin-bottom: 2px;
    transition: background .12s, border-color .12s;
  }
  .item:hover { background: var(--bg-hover); }
  .item.active {
    background: var(--bg-elevated);
    border-color: var(--line);
    box-shadow: var(--specular);
  }
  .item-row1 { display: flex; align-items: center; gap: 8px; }
  .item-title {
    flex: 1;
    font-size: 12.5px;
    font-weight: 500;
    color: var(--text-1);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-stat { font-size: 11px; color: var(--text-3); flex-shrink: 0; }
  .item-row2 {
    margin-top: 4px;
    padding-left: 15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-3);
  }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
  .dot.review { background: var(--warn); }
  .dot.ready { background: var(--text-3); }
  .dot.developing {
    background: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
    animation: pulse 2s infinite;
  }
  .dot.merged { background: var(--ok); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 2px var(--accent-soft); }
    50% { box-shadow: 0 0 0 5px transparent; }
  }

  .rail-foot {
    padding: 10px 12px;
    border-top: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  /* Buttons */
  .btn {
    height: 28px;
    padding: 0 11px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-elevated);
    color: var(--text-1);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    box-shadow: var(--specular);
    transition: all .12s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--line-strong); background: var(--bg-active); }
  .btn:active { transform: translateY(0.5px); }
  .btn-cta {
    background: var(--cta-bg);
    color: var(--cta-text);
    border-color: transparent;
    box-shadow: none;
  }
  .btn-cta:hover { background: var(--cta-hover); border-color: transparent; }
  .btn-ghost {
    background: transparent;
    border-color: transparent;
    box-shadow: none;
    color: var(--text-2);
    padding: 0 7px;
  }
  .btn-ghost:hover { background: var(--bg-hover); color: var(--text-1); border-color: transparent; }
  .btn-danger {
    color: var(--err);
    background: var(--err-soft);
    border-color: var(--err-line);
    box-shadow: none;
  }

  /* Center Stage */
  .stage {
    background: var(--bg-stage);
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
  }
  .topbar {
    height: 46px;
    padding: 0 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .topbar-left, .topbar-right { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-3);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .breadcrumb strong { color: var(--text-1); font-weight: 500; }

  .stage-head {
    padding: 22px 32px 0;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .stage-title-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 20px;
    margin-bottom: 16px;
  }
  .stage-title {
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.025em;
    line-height: 1.3;
    color: var(--text-1);
  }
  .stage-sub {
    margin-top: 6px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12px;
    color: var(--text-2);
  }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 2px 8px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid var(--line);
    background: var(--bg-elevated);
    color: var(--text-2);
  }
  .chip.warn { background: var(--warn-soft); border-color: var(--warn-line); color: var(--warn); }
  .chip.accent { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent); }
  .chip.ok { background: var(--ok-soft); border-color: var(--ok-line); color: var(--ok); }

  .tabs { display: flex; gap: 22px; }
  .tab {
    position: relative;
    padding: 8px 0 11px;
    border: none;
    background: transparent;
    color: var(--text-3);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: color .12s;
  }
  .tab:hover { color: var(--text-2); }
  .tab.active { color: var(--text-1); }
  .tab.active::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: -1px;
    height: 1.5px;
    background: var(--text-1);
  }

  .stage-body { flex: 1; overflow-y: auto; padding: 26px 32px 48px; }
  .measure { max-width: 720px; }
  .block { padding-bottom: 24px; margin-bottom: 24px; border-bottom: 1px solid var(--line); }
  .block:last-child { border-bottom: none; }
  .block-label { font-size: 11.5px; font-weight: 500; color: var(--text-3); margin-bottom: 10px; }
  .prose { font-size: 13.5px; line-height: 1.7; color: var(--text-2); white-space: pre-wrap; }

  .check-list { display: flex; flex-direction: column; gap: 9px; }
  .check-item { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-1); }
  .check-box {
    width: 15px;
    height: 15px;
    border-radius: 4px;
    border: 1px solid var(--ok-line);
    display: grid;
    place-items: center;
    font-size: 10px;
    color: var(--ok);
    background: var(--ok-soft);
    flex-shrink: 0;
  }
  .check-box.todo { background: transparent; border-color: var(--line-strong); color: transparent; }

  .stream { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
  .stream-head {
    padding: 9px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11.5px;
    color: var(--text-3);
  }
  .stream-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 13px; font-size: 12px; }
  .log-row { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 12px; }

  .diff-box { border: 1px solid var(--line); border-radius: 8px; background: var(--code-bg); overflow: hidden; }
  .diff-head {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    color: var(--text-2);
  }
  .diff-line { padding: 2px 14px; font-size: 12px; line-height: 1.65; white-space: pre; overflow-x: auto; }
  .diff-line.hunk { color: var(--text-3); background: var(--bg-hover); }
  .diff-line.add { background: var(--diff-add-bg); color: var(--ok); }
  .diff-line.del { background: var(--diff-del-bg); color: var(--err); }

  /* Right Inspector */
  .inspector {
    background: var(--bg-rail);
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    gap: 18px;
  }
  .insp-sec { padding-bottom: 16px; border-bottom: 1px solid var(--line); }
  .insp-sec:last-child { border-bottom: none; }
  .insp-title {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-3);
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .kv { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 0; font-size: 12px; }
  .kv-k { color: var(--text-3); }
  .kv-v { color: var(--text-1); text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .path-box {
    margin-top: 6px;
    padding: 8px 10px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--bg-stage);
    font-size: 11px;
    color: var(--text-2);
    word-break: break-all;
    cursor: pointer;
  }
  .path-box:hover { border-color: var(--line-strong); color: var(--text-1); }

  /* ========================
   * PUBLISH MODAL (Optical Precision)
   * ======================== */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: var(--backdrop);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .16s ease;
    z-index: 100;
  }
  .modal-backdrop.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    width: 100%;
    max-width: 580px;
    max-height: 90vh;
    background: var(--bg-modal);
    border-radius: 11px;
    box-shadow: var(--modal-shadow), var(--specular);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transform: translateY(8px) scale(0.985);
    transition: transform .18s cubic-bezier(.2,.8,.2,1);
  }
  .modal-backdrop.open .modal {
    transform: translateY(0) scale(1);
  }

  .modal-head {
    padding: 15px 20px;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .modal-title-group {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .modal-title {
    font-size: 14px;
    font-weight: 600;
    letter-spacing: -0.015em;
  }
  .modal-badge {
    font-size: 10.5px;
    color: var(--text-3);
    padding: 1px 6px;
    border-radius: 4px;
    border: 1px solid var(--line);
    background: var(--bg-stage);
  }

  .modal-body {
    padding: 18px 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .field-row-2 {
    display: grid;
    grid-template-columns: 1.3fr 1fr;
    gap: 12px;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .label {
    font-size: 11.5px;
    font-weight: 500;
    color: var(--text-2);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .label-hint {
    font-weight: 400;
    font-size: 11px;
    color: var(--text-3);
  }

  .input, .select, .textarea {
    width: 100%;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--bg-stage);
    color: var(--text-1);
    font-family: inherit;
    font-size: 12.5px;
    outline: none;
    transition: border-color .14s, background .14s;
  }
  .input, .select {
    height: 34px;
    padding: 0 10px;
  }
  .textarea {
    padding: 9px 11px;
    min-height: 92px;
    resize: vertical;
    line-height: 1.6;
  }
  .input::placeholder, .textarea::placeholder { color: var(--text-3); }
  .input:focus, .select:focus, .textarea:focus {
    border-color: var(--line-strong);
    background: var(--bg-elevated);
  }

  /* Criteria Builder */
  .criteria-box {
    border: 1px solid var(--line);
    border-radius: 7px;
    background: var(--bg-stage);
    overflow: hidden;
  }
  .criteria-items {
    display: flex;
    flex-direction: column;
  }
  .criteria-chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 7px 10px;
    border-bottom: 1px solid var(--line);
    font-size: 12px;
    color: var(--text-1);
  }
  .criteria-remove {
    border: none;
    background: transparent;
    color: var(--text-3);
    cursor: pointer;
    font-size: 13px;
    padding: 0 4px;
    border-radius: 4px;
  }
  .criteria-remove:hover { color: var(--err); background: var(--err-soft); }
  .criteria-add-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 6px;
  }
  .criteria-input {
    flex: 1;
    height: 28px;
    border: none;
    background: transparent;
    color: var(--text-1);
    font-size: 12px;
    padding: 0 4px;
    outline: none;
  }
  .criteria-input::placeholder { color: var(--text-3); }

  /* Advanced Collapsible */
  .adv-toggle {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: none;
    background: transparent;
    color: var(--text-3);
    font-size: 11.5px;
    font-weight: 500;
    cursor: pointer;
    align-self: flex-start;
  }
  .adv-toggle:hover { color: var(--text-2); }
  .adv-panel {
    display: none;
    padding: 12px;
    border-radius: 7px;
    border: 1px solid var(--line);
    background: var(--bg-rail);
    flex-direction: column;
    gap: 12px;
  }
  .adv-panel.open { display: flex; }

  /* Toggle Switch */
  .switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .switch-desc { font-size: 11px; color: var(--text-3); margin-top: 2px; }
  .switch {
    position: relative;
    width: 34px;
    height: 20px;
    flex-shrink: 0;
  }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute;
    inset: 0;
    border-radius: 999px;
    background: var(--bg-active);
    border: 1px solid var(--line-strong);
    cursor: pointer;
    transition: .15s;
  }
  .slider::before {
    content: "";
    position: absolute;
    width: 14px;
    height: 14px;
    left: 2px;
    top: 2px;
    border-radius: 50%;
    background: var(--text-2);
    transition: .15s;
  }
  .switch input:checked + .slider {
    background: var(--cta-bg);
    border-color: var(--cta-bg);
  }
  .switch input:checked + .slider::before {
    transform: translateX(14px);
    background: var(--cta-text);
  }

  .modal-foot {

    border-top: 1px solid var(--line);

  .toast {

</head>
<body>
<div class="app" id="app">
  <!-- 左侧导航栏 -->
  <aside class="rail">
    <div class="rail-top">
      <div class="logo">
        <span class="logo-mark">W</span>
        <span>Worktree</span>
      </div>
      <button class="btn btn-cta" style="height:25px;padding:0 9px;font-size:11.5px" onclick="openPublishModal()" title="发布新任务 (N)">+ 发布</button>
    </div>

    <div class="rail-controls">
      <div class="search-wrap">
        <input class="search" id="search" placeholder="搜索任务或分支…" />
        <span class="search-kbd mono">/</span>
      </div>
      <div class="pills" id="pills">
        <button class="pill active" data-f="all">全部</button>
        <button class="pill" data-f="review">待验收</button>
        <button class="pill" data-f="developing">运行中</button>
      </div>
    </div>

    <div class="rail-list" id="list"></div>

    <div class="rail-foot">
      <span class="mono" id="railCount" style="font-size:11px;color:var(--text-3)"></span>
      <button class="btn btn-ghost" id="themeBtn" style="height:24px;font-size:11px">切换暖浅色</button>
    </div>
  </aside>

  <!-- 中间主舞台 -->
  <main class="stage">
    <div class="topbar">
      <div class="topbar-left">
        <button class="btn btn-ghost" onclick="toggle('left')" title="折叠左侧 ([)">◧</button>
        <div class="breadcrumb">
          <span id="bProject"></span>
          <span>/</span>
          <strong class="mono" id="bBranch"></strong>
        </div>
      </div>
      <div class="topbar-right">
        <button class="btn btn-ghost" onclick="toggle('right')" title="折叠右侧检查器 (])">◨ 检查器</button>
      </div>
    </div>

    <header class="stage-head">
      <div class="stage-title-row">
        <div style="min-width:0">
          <h1 class="stage-title" id="sTitle"></h1>
          <div class="stage-sub">
            <span class="chip" id="sChip"></span>
            <span class="mono" id="sMeta" style="color:var(--text-3)"></span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-shrink:0" id="sCta"></div>
      </div>

      <nav class="tabs" id="tabs">
        <button class="tab active" data-t="overview">概览与验收</button>
        <button class="tab" data-t="live">实时会话</button>
        <button class="tab" data-t="diff">代码改动 <span class="mono" style="font-size:11px;color:var(--text-3)" id="sDiffCnt"></span></button>
      </nav>
    </header>

    <div class="stage-body" id="stageBody"></div>
  </main>

  <!-- 右侧常驻 Inspector -->
  <aside class="inspector" id="inspector"></aside>
</div>

<!-- 发布任务弹窗 -->
<div class="modal-backdrop" id="publishModal" onclick="if(event.target===this) closePublishModal()">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-head">
      <div class="modal-title-group">
        <span class="modal-title" id="modalTitle">发布 Worktree 任务</span>
        <span class="modal-badge mono">git worktree add</span>
      </div>
      <button class="btn btn-ghost" onclick="closePublishModal()" title="关闭 (Esc)">✕</button>
    </div>

    <form id="publishForm" class="modal-body" onsubmit="submitPublish(event)">
      <div class="field-row-2">
        <div class="field">
          <label class="label" for="fProject">所属项目</label>
          <select class="select" id="fProject" onchange="syncProjectBase()">
            <option value="dsh-worktree" data-base="master" data-path="C:\Users\liang\dsh-worktree">dsh-worktree</option>
            <option value="magpie-gateway" data-base="main" data-path="C:\Users\liang\magpie-gateway">magpie-gateway</option>
          </select>
        </div>
        <div class="field">
          <label class="label" for="fBase">基线分支 <span class="label-hint">base</span></label>
          <input class="input mono" id="fBase" value="master" required />
        </div>
      </div>

      <div class="field">
        <label class="label" for="fTitle">任务标题 <span class="label-hint">必填</span></label>
        <input class="input" id="fTitle" placeholder="例如：优化 merge-preflight 冲突提示文案" required />
      </div>

      <div class="field">
        <label class="label" for="fDesc">任务说明 <span class="label-hint">将作为绑定会话的首条提示词</span></label>
        <textarea class="textarea" id="fDesc" placeholder="描述改动目标、约束条件、需要运行的验证命令（如 npm run typecheck && npm test）…" required></textarea>
      </div>

      <div class="field">
        <label class="label">验收标准 <span class="label-hint">可选 · 按 Enter 添加</span></label>
        <div class="criteria-box">
          <div class="criteria-items" id="fCriteriaList"></div>
          <div class="criteria-add-row">
            <input class="criteria-input" id="fCriteriaInput" placeholder="输入一条可勾选的验收结果，按 Enter 添加…" />
            <button type="button" class="btn btn-ghost" style="height:24px;font-size:11px" onclick="addCriterion()">添加</button>
          </div>
        </div>
      </div>

      <button type="button" class="adv-toggle" id="advToggleBtn" onclick="toggleAdvanced()">
        <span id="advArrow">▸</span> 高级选项（自定义分支名与启动行为）
      </button>

      <div class="adv-panel" id="advPanel">
        <div class="field">
          <label class="label" for="fBranch">自定义任务分支名 <span class="label-hint">留空则自动生成 dsh-wt/&lt;id&gt;</span></label>
          <input class="input mono" id="fBranch" placeholder="dsh-wt/auto-generated" />
        </div>
        <div class="switch-row">
          <div>
            <div style="font-size:12px;font-weight:500">发布后立即启动 Agent 会话</div>
            <div class="switch-desc">自动创建隔离 worktree 并发送任务说明与验收标准</div>
          </div>
          <label class="switch">
            <input type="checkbox" id="fStart" checked />
            <span class="slider"></span>
          </label>
        </div>
      </div>
    </form>

    <div class="modal-foot">
      <span class="modal-foot-meta mono" id="fPreviewPath">worktree → .dsh-worktrees/…</span>
      <div class="modal-foot-actions">
        <button type="button" class="btn btn-ghost" onclick="closePublishModal()">取消</button>
        <button type="submit" form="publishForm" class="btn btn-cta">创建并启动</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TASKS = [
  {
    id: 't1',
    project: 'dsh-worktree',
    base: 'master',
    branch: 'dsh-wt/a94f21c8',
    title: '拆分 task-detail.ts 为三栏架构并补回 techCard',
    status: 'review',
    statusText: '待验收',
    chipClass: 'warn',
    stat: '↑3',
    updated: '4m ago',
    primary: '切到主仓库验收',
    secondary: '直接合并',
    preflight: '无冲突 · 可安全合并',
    baseSha: 'a3e392d',
    headSha: 'f81c40e',
    sessionId: 'sess_01k9m8v2x4q',
    path: 'C:\\Users\\liang\\dsh-worktree\\.dsh-worktrees\\a94f21c8',
    diffCount: 4,
    desc: '移除原详情页的纵向卡片瀑布流，将 Git 预检、分支拓扑、Worktree 路径与危险操作收拢到右侧可折叠检查器，主舞台专注阅读、实时会话与全宽 Diff。',
    checks: [
      { t: '主舞台与右侧检查器支持 [ / ] 一键折叠', ok: true },
      { t: '原漏渲染的 techCard 信息常驻检查器且支持一键复制', ok: true },
      { t: 'npm run typecheck 与 22 组单测全部通过', ok: true }
    ]
  },
  {
    id: 't2',
    project: 'dsh-worktree',
    base: 'master',
    branch: 'dsh-wt/b72e10d4',
    title: '桥接宿主 --dsw-* 变量并升级暖象牙浅色模式',
    status: 'developing',
    statusText: 'Agent 运行中',
    chipClass: 'accent',
    stat: '↑1 · 2M',
    updated: 'now',
    primary: '打开原生会话',
    secondary: '查看日志',
    preflight: '开发中（2 个未提交文件）',
    baseSha: 'a3e392d',
    headSha: 'c42b91a',
    sessionId: 'sess_01k9m9a7p1z',
    path: 'C:\\Users\\liang\\dsh-worktree\\.dsh-worktrees\\b72e10d4',
    diffCount: 2,
    desc: '重构 palette.ts，深色模式采用曜石碳灰阶与 1px 顶部高光，浅色模式采用 Warm Alabaster 搭配深墨黑主按钮。',
    checks: [
      { t: '拉开三档文字对比度（text-1 / text-2 / text-3）', ok: true },
      { t: '宿主主题切换时自动同步，无闪烁', ok: false }
    ]
  },
  {
    id: 't3',
    project: 'magpie-gateway',
    base: 'main',
    branch: 'dsh-wt/d04f55b9',
    title: '按模型路由组聚合每日 Token 消耗与成本统计',
    status: 'merged',
    statusText: '已合并',
    chipClass: 'ok',
    stat: 'merged',
    updated: '1d ago',
    primary: '清理 Worktree',
    secondary: '派生后续任务',
    preflight: '已通过 --no-ff 合入 main',
    baseSha: '71a9c02',
    headSha: 'e03f118',
    sessionId: 'sess_01k9k1z9m3w',
    path: 'C:\\Users\\liang\\magpie-gateway\\.dsh-worktrees\\d04f55b9',
    diffCount: 5,
    desc: '在本地网关侧新增按路由组维度的统计聚合接口与日报导出。',
    checks: [
      { t: '已合入 main 并保留完整合并记录', ok: true }
    ]
  }
];

let state = { id: 't1', tab: 'overview', f: 'all', q: '' };
let draftCriteria = ['npm run typecheck 与单测全部通过'];

function cur() { return TASKS.find(x => x.id === state.id) || TASKS[0]; }

function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(() => el.classList.remove('show'), 2200);
}

function toggle(side) {
  document.getElementById('app').classList.toggle(side === 'left' ? 'hide-left' : 'hide-right');
}

function renderList() {
  const q = state.q.trim().toLowerCase();
  const rows = TASKS.filter(t => {
    if (state.f !== 'all' && t.status !== state.f) return false;
    if (q && !(t.title.toLowerCase().includes(q) || t.branch.toLowerCase().includes(q))) return false;
    return true;
  });

  const groups = {};
  rows.forEach(t => (groups[t.project] ||= []).push(t));
  const repoCount = new Set(TASKS.map(t => t.project)).size;
  document.getElementById('railCount').textContent = `${repoCount} repos · ${TASKS.length} tasks`;

  document.getElementById('list').innerHTML = Object.entries(groups).map(([p, items]) => `
    <div class="group-head">
      <span>${p}</span>
      <span class="mono">${items.length}</span>
    </div>
    ${items.map(t => `
      <div class="item ${t.id === state.id ? 'active' : ''}" onclick="pick('${t.id}')">
        <div class="item-row1">
          <span class="dot ${t.status}"></span>
          <span class="item-title">${t.title}</span>
          <span class="item-stat mono">${t.stat}</span>
        </div>
        <div class="item-row2 mono">
          <span>${t.branch.replace('dsh-wt/', '')}</span>
          <span>${t.updated}</span>
        </div>
      </div>
    `).join('')}
  `).join('') || `<div style="padding:24px;text-align:center;color:var(--text-3);font-size:12px">无匹配任务</div>`;
}

function pick(id) {
  state.id = id;
  renderList();
  renderMain();
}

function renderMain() {
  const t = cur();
  document.getElementById('bProject').textContent = t.project;
  document.getElementById('bBranch').textContent = `${t.branch} → ${t.base}`;
  document.getElementById('sTitle').textContent = t.title;
  const chip = document.getElementById('sChip');
  chip.className = `chip ${t.chipClass}`;
  chip.innerHTML = `<span class="dot ${t.status}"></span>${t.statusText}`;
  document.getElementById('sMeta').textContent = `${t.baseSha}..${t.headSha} · ${t.updated}`;
  document.getElementById('sDiffCnt').textContent = t.diffCount;

  document.getElementById('sCta').innerHTML = `
    <button class="btn" onclick="toast('${t.secondary}')">${t.secondary}</button>
    <button class="btn btn-cta" onclick="toast('正在执行：${t.primary}')">${t.primary}</button>
  `;

  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.t === state.tab));

  const body = document.getElementById('stageBody');
  if (state.tab === 'overview') {
    body.innerHTML = `
      <div class="measure">
        <div class="block">
          <div class="block-label">任务描述</div>
          <p class="prose">${t.desc}</p>
        </div>
        <div class="block">
          <div class="block-label">验收标准</div>
          <div class="check-list">
            ${t.checks.length ? t.checks.map(c => `
              <div class="check-item">
                <span class="check-box ${c.ok ? '' : 'todo'}">✓</span>
                <span>${c.t}</span>
              </div>
            `).join('') : `<span style="color:var(--text-3);font-size:12px">未设置验收标准</span>`}
          </div>
        </div>
      </div>
    `;
  } else if (state.tab === 'live') {
    body.innerHTML = `
      <div class="stream">
        <div class="stream-head mono">
          <span>SESSION · ${t.sessionId}</span>
          <button class="btn btn-ghost" style="height:22px;font-size:11px" onclick="toast('跳转原生会话')">打开原生会话 ↗</button>
        </div>
        <div class="stream-body mono">
          <div class="log-row"><span style="color:var(--accent)">USER</span><span>${t.desc}</span></div>
          <div class="log-row"><span style="color:var(--ok)">TOOL</span><span>git worktree add ${t.path} -b ${t.branch}</span></div>
          <div class="log-row"><span style="color:var(--text-3)">AGENT</span><span>已进入隔离工作区，正在分析相关文件并准备实施…</span></div>
        </div>
      </div>
    `;
  } else {
    body.innerHTML = `
      <div class="diff-box">
        <div class="diff-head mono">
          <span>src/client/task-detail.ts</span>
          <span><span style="color:var(--ok)">+142</span> <span style="color:var(--err)">-318</span></span>
        </div>
        <div class="diff-line hunk mono">@@ -1315,7 +1315,10 @@ export function TaskDetail(props) {</div>
        <div class="diff-line mono">   const techCard = buildTechCard(task, snapshot)</div>
        <div class="diff-line del mono">-  return h('div', { className: 'dshw-stack' }, hero, banners, liveCard, diffCard)</div>
        <div class="diff-line add mono">+  return h('div', { className: 'dshw-stage-grid' },</div>
        <div class="diff-line add mono">+    renderStage(activeTab, { hero, liveCard, diffCard }),</div>
        <div class="diff-line add mono">+    renderInspector({ preflight, techCard, dangerCard })</div>
        <div class="diff-line add mono">+  )</div>
      </div>
    `;
  }

  document.getElementById('inspector').innerHTML = `
    <div class="insp-sec">
      <div class="insp-title"><span>合并预检</span><span style="color:var(--ok)">●</span></div>
      <div style="font-size:12px;color:var(--text-1);margin-bottom:8px">${t.preflight}</div>
      <div class="kv"><span class="kv-k">目标基线</span><span class="kv-v mono">${t.base} @ ${t.baseSha}</span></div>
      <div class="kv"><span class="kv-k">任务提交</span><span class="kv-v mono">${t.headSha}</span></div>
    </div>
    <div class="insp-sec">
      <div class="insp-title"><span>技术信息</span><span style="font-weight:400">点击复制</span></div>
      <div class="kv"><span class="kv-k">分支</span><span class="kv-v mono">${t.branch}</span></div>
      <div class="kv"><span class="kv-k">会话 ID</span><span class="kv-v mono">${t.sessionId}</span></div>
      <div class="path-box mono" onclick="toast('已复制 Worktree 路径')">${t.path}</div>
    </div>
    <div class="insp-sec">
      <div class="insp-title"><span>生命周期管理</span></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn" style="justify-content:center" onclick="toast('已归档任务')">归档任务</button>
        <button class="btn btn-danger" style="justify-content:center" onclick="toast('打开清理 Worktree 确认')">清理 Worktree</button>
      </div>
    </div>
  `;
}

/* Publish Modal Logic */
function openPublishModal() {
  renderDraftCriteria();
  syncProjectBase();
  document.getElementById('publishModal').classList.add('open');
  setTimeout(() => document.getElementById('fTitle').focus(), 60);
}

function closePublishModal() {
  document.getElementById('publishModal').classList.remove('open');
}

function syncProjectBase() {
  const sel = document.getElementById('fProject');
  const opt = sel.options[sel.selectedIndex];
  document.getElementById('fBase').value = opt.dataset.base;
  document.getElementById('fPreviewPath').textContent = `${opt.value}\\.dsh-worktrees\\<auto-id>`;
}

function renderDraftCriteria() {
  document.getElementById('fCriteriaList').innerHTML = draftCriteria.map((c, i) => `
    <div class="criteria-chip">
      <span>${c}</span>
      <button type="button" class="criteria-remove" onclick="removeCriterion(${i})" title="移除">×</button>
    </div>
  `).join('');
}

function addCriterion() {
  const inp = document.getElementById('fCriteriaInput');
  const v = inp.value.trim();
  if (!v) return;
  draftCriteria.push(v);
  inp.value = '';
  renderDraftCriteria();
}

function removeCriterion(i) {
  draftCriteria.splice(i, 1);
  renderDraftCriteria();
}

function toggleAdvanced() {
  const panel = document.getElementById('advPanel');
  const open = panel.classList.toggle('open');
  document.getElementById('advArrow').textContent = open ? '▾' : '▸';
}

function submitPublish(e) {
  e.preventDefault();
  const sel = document.getElementById('fProject');
  const opt = sel.options[sel.selectedIndex];
  const title = document.getElementById('fTitle').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  const base = document.getElementById('fBase').value.trim() || opt.dataset.base;
  const autoStart = document.getElementById('fStart').checked;
  const rand = Math.random().toString(16).slice(2, 10);
  const customBranch = document.getElementById('fBranch').value.trim();
  const branch = customBranch || `dsh-wt/${rand}`;

  const newTask = {
    id: 't_' + rand,
    project: opt.value,
    base,
    branch,
    title,
    status: autoStart ? 'developing' : 'ready',
    statusText: autoStart ? 'Agent 运行中' : '就绪',
    chipClass: autoStart ? 'accent' : '',
    stat: '0',
    updated: 'just now',
    primary: autoStart ? '打开原生会话' : '启动 Agent 会话',
    secondary: '查看日志',
    preflight: autoStart ? '会话已启动，等待首次提交' : '已创建隔离工作区，尚未开始',
    baseSha: 'a3e392d',
    headSha: 'a3e392d',
    sessionId: 'sess_' + rand,
    path: `${opt.dataset.path}\\.dsh-worktrees\\${rand}`,
    diffCount: 0,
    desc,
    checks: draftCriteria.map(t => ({ t, ok: false }))
  };

  TASKS.unshift(newTask);
  state.id = newTask.id;
  state.tab = 'overview';

  document.getElementById('publishForm').reset();
  draftCriteria = ['npm run typecheck 与单测全部通过'];
  closePublishModal();
  renderList();
  renderMain();
  toast(autoStart ? `已发布并启动：${branch}` : `已创建 Worktree：${branch}`);
}

document.getElementById('fCriteriaInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    addCriterion();
  }
});

document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => { state.tab = b.dataset.t; renderMain(); }));
document.querySelectorAll('.pill').forEach(b => b.addEventListener('click', () => {
  state.f = b.dataset.f;
  document.querySelectorAll('.pill').forEach(x => x.classList.toggle('active', x === b));
  renderList();
}));
document.getElementById('search').addEventListener('input', e => { state.q = e.target.value; renderList(); });
document.getElementById('themeBtn').addEventListener('click', e => {
  const root = document.documentElement;
  const dark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  e.target.textContent = dark ? '切换曜石深色' : '切换暖浅色';
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closePublishModal(); return; }
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('search').focus(); }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openPublishModal(); }
  if (e.key === '[') toggle('left');
  if (e.key === ']') toggle('right');
});

renderList();
renderMain();
</script>
</body>
</html>
