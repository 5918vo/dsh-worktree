<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dsh-worktree · 原型</title>
<style>
/* ── tokens ─────────────────────────────────────────────────────────────── */
:root[data-theme="dark"]{
  --paper:#0b0b0c;
  --shell:#070708;
  --ink:#f2f0ec;
  --ink-2:#a9a59d;
  --ink-3:#807c74;
  --rule:rgba(242,240,236,.105);
  --rule-2:rgba(242,240,236,.055);
  --sel:rgba(242,240,236,.05);
  --accent:#e0a256;
  --accent-bg:rgba(224,162,86,.13);
  --accent-line:rgba(224,162,86,.38);
  --ok:#8fbf94;  --ok-bg:rgba(143,191,148,.12);
  --warn:#d9a93f; --warn-bg:rgba(217,169,63,.12);
  --err:#e0776f;  --err-bg:rgba(224,119,111,.12);
  --inv-bg:#f2f0ec; --inv-ink:#0b0b0c;
  --add:#8fbf94; --del:#e0776f; --user:#b9b6f2; --tool:#8fbf94;
  --scrim:rgba(4,4,5,.62);
  --lift:0 22px 60px rgba(0,0,0,.55);
}
:root[data-theme="light"]{
  --paper:#f8f5ef;
  --shell:#f1ede4;
  --ink:#17150f;
  --ink-2:#4d4a42;
  --ink-3:#736f64;
  --rule:rgba(23,21,15,.14);
  --rule-2:rgba(23,21,15,.07);
  --sel:rgba(23,21,15,.055);
  --accent:#9a5619;
  --accent-bg:rgba(154,86,25,.1);
  --accent-line:rgba(154,86,25,.32);
  --ok:#3f7a4a;  --ok-bg:rgba(63,122,74,.1);
  --warn:#8a5a12; --warn-bg:rgba(138,90,18,.1);
  --err:#a83a34;  --err-bg:rgba(168,58,52,.1);
  --inv-bg:#17150f; --inv-ink:#f8f5ef;
  --add:#3f7a4a; --del:#a83a34; --user:#4b3fa0; --tool:#2f6b3a;
  --scrim:rgba(60,50,30,.28);
  --lift:0 24px 60px rgba(40,30,10,.18);
}
:root{
  --mono:"JetBrains Mono","Cascadia Code",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"Inter","SF Pro Text",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  --r-sm:5px; --r-md:8px;
  --ease:cubic-bezier(.22,.8,.24,1);
}
*{box-sizing:border-box}
*{scrollbar-width:thin;scrollbar-color:var(--rule) transparent}
body{margin:0;font-family:var(--sans);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased;background:transparent}
h1,h2,h3,p{margin:0}
ul{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ico{width:15px;height:15px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;display:block}
.ico-sm{width:13px;height:13px}
.sr{position:absolute;width:1px;height:1px;clip:rect(0 0 0 0);overflow:hidden;white-space:nowrap}

/* ── 外壳 ───────────────────────────────────────────────────────────────── */
.wrap{max-width:1120px;margin:0 auto}
.shell-out{background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 16px 16px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 2px 12px}
.bar .tools{margin-left:auto;display:flex;gap:2px;align-items:center}
.tog{height:24px;padding:0 9px;border-radius:var(--r-sm);font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--ink-3);transition:.16s var(--ease)}
.tog:hover{color:var(--ink)}
.tog[aria-pressed="true"]{color:var(--ink);background:var(--sel)}

.frame{
  height:752px;display:grid;grid-template-columns:228px minmax(0,1fr) 258px;
  grid-template-rows:44px minmax(0,1fr);
  border:1px solid var(--rule);border-radius:var(--r-md);overflow:hidden;
  background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.32);
  font-size:13px;line-height:1.5;position:relative;
}
.frame :focus-visible{outline:1.5px solid var(--accent);outline-offset:1px;border-radius:2px}
.strip{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;border-bottom:1px solid var(--rule);background:var(--shell);min-width:0}
.strip .id{font-family:var(--mono);font-size:11px;letter-spacing:.16em;color:var(--ink-3);white-space:nowrap}
.strip .id b{color:var(--ink);letter-spacing:.1em;font-weight:600}
.strip .proj{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);min-width:0}
.strip .proj svg{color:var(--ink-3)}
.strip .proj .br{font-family:var(--mono);font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.strip .sp{margin-left:auto}
.strip-btn{width:26px;height:26px;display:grid;place-items:center;border-radius:var(--r-sm);color:var(--ink-3);transition:.16s var(--ease);position:relative}
.strip-btn:hover{background:var(--sel);color:var(--ink)}
.strip-btn[aria-pressed="true"]{color:var(--accent);background:var(--accent-bg)}

/* ── 左栏 ───────────────────────────────────────────────────────────────── */
.rail{background:var(--shell);border-right:1px solid var(--rule);display:flex;flex-direction:column;min-height:0;
  --rp:12px; --gut:16px; --rgap:6px}
.rail-search{display:flex;align-items:center;gap:var(--rgap);padding:10px var(--rp);border-bottom:1px solid var(--rule-2);color:var(--ink-3)}
.rail-search .ico{width:var(--gut);height:var(--gut)}
.rail-search input{flex:1;min-width:0;border:0;background:none;outline:none;font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.rail-search input::placeholder{color:var(--ink-3)}
.filters{display:flex;gap:12px;padding:10px var(--rp) 9px calc(var(--rp) + var(--gut) + var(--rgap));border-bottom:1px solid var(--rule)}
.filters button{font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--ink-3);padding:0 0 3px;border-bottom:1px solid transparent;transition:.16s var(--ease);white-space:nowrap}
.filters button:hover{color:var(--ink-2)}
.filters button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.filters button .n{color:var(--ink-3);margin-left:3px}

.tree{flex:1;min-height:0;overflow:auto;padding:6px 0 10px}
.grp{position:relative;display:flex;align-items:center;gap:var(--rgap);width:100%;min-height:30px;padding:6px var(--rp);margin-top:8px;color:var(--ink-3)}
.tree>.grp:first-child{margin-top:0}
.grp:hover{color:var(--ink-2)}
.grp[aria-expanded="false"] .caret{transform:rotate(-90deg)}
.grp .caret{width:var(--gut);height:9px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;transition:transform .2s var(--ease)}
.grp .pname{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;color:inherit;padding:0;flex:1;min-width:0}
.grp .pname:hover{color:var(--ink)}
.grp[aria-expanded="true"] .pname{color:var(--ink-2)}
.grp .caret-btn{width:var(--gut);height:14px;display:grid;place-items:center;flex:none;color:inherit}
.grp .n{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.grp .add{position:absolute;right:var(--rp);top:50%;transform:translateY(-50%);width:18px;height:18px;display:grid;place-items:center;opacity:0;border-radius:3px}
.grp:hover .add,.grp:focus-within .add{opacity:1;background:var(--shell)}
.grp .add:hover{background:var(--sel);color:var(--ink)}

.trow{display:grid;grid-template-columns:var(--gut) minmax(0,1fr);align-items:start;gap:var(--rgap);
  width:100%;text-align:left;padding:8px var(--rp);position:relative;color:var(--ink);transition:background .16s var(--ease)}
.trow:hover{background:var(--sel)}
.trow[aria-current="true"]{background:var(--sel);box-shadow:inset 1.5px 0 0 var(--accent)}
.trow>span{min-width:0;display:block}
.trow .mark{margin-top:3px;width:var(--gut);display:grid;place-items:center;color:var(--ink-3)}
.trow .mark i{display:block;width:5px;height:5px;background:currentColor}
.trow .mark i.run{background:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}
.trow .mark i.ok{background:var(--ok)}
.trow .mark i.warn{background:var(--warn)}
.trow .mark i.err{background:var(--err)}
.trow .tt{display:block;font-size:12.5px;line-height:1.45;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow[aria-current="true"] .tt{font-weight:600}
.trow .tm{margin-top:2px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);display:grid;
  grid-template-columns:minmax(0,1fr) 24px 27px;min-width:0}
.trow .tm .b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .tm .plus{text-align:right;padding-right:8px}
.trow .tm .t{text-align:right}
.trow .tm .t.acc{color:var(--accent)}
.rail-new{display:flex;align-items:center;gap:var(--rgap);margin:0 var(--rp);padding:8px 0;border-top:1px dashed var(--rule);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);transition:.16s var(--ease)}
.rail-new .ico{width:var(--gut);height:var(--gut)}
.rail-new:hover{color:var(--accent)}
.reconnect{display:flex;align-items:center;gap:8px;margin:0 var(--rp);padding:7px 8px;border:1px solid var(--warn);border-radius:3px;
  font-size:11.5px;color:var(--warn);background:transparent}
.reconnect .spin{border-color:color-mix(in srgb,var(--warn) 30%,transparent);border-top-color:var(--warn);width:11px;height:11px}
.reconnect .btn{margin-left:auto;height:22px;font-size:11px;padding:0 8px;border-color:var(--warn);color:var(--warn)}
.railed{display:grid;place-items:center;text-align:center;gap:6px;padding:46px 18px;flex:1;align-content:center}
.railed .ico{color:var(--ink-3);margin-bottom:2px}
.railed h3{font-size:13px;font-weight:600;color:var(--ink)}
.railed p{font-size:11.5px;color:var(--ink-3);line-height:1.55;max-width:190px}
.railed .btn{margin-top:6px}
.stageed{display:grid;place-content:center;gap:10px;text-align:center;height:100%;padding:40px}
.stageed h2{font-size:22px;letter-spacing:-.02em;font-weight:600}
.stageed p{font-size:13px;color:var(--ink-2);max-width:420px;line-height:1.6}
.stageed .btn{justify-self:center;margin-top:8px}
.stageed .ico{width:20px;height:20px;color:var(--ink-3);justify-self:center}
.live.off{color:var(--ink-3)}
.live.off .slot i{background:var(--ink-3);animation:none}
.rail-nav{display:flex;align-items:center;gap:var(--rgap);margin:0 var(--rp);padding:8px 0;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);transition:.16s var(--ease)}
.rail-nav .ico{width:var(--gut);height:var(--gut)}
.rail-nav:hover{color:var(--ink)}
.rail-nav[aria-current="page"]{color:var(--ink)}
.rail-nav[aria-current="page"] .ico{color:var(--accent)}
.rail-foot{display:flex;align-items:center;gap:var(--rgap);padding:9px var(--rp);border-top:1px solid var(--rule);font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.rail-foot .live{display:inline-flex;align-items:center;gap:var(--rgap);color:var(--ok)}
.rail-foot .live .slot{width:var(--gut);display:grid;place-items:center}
.rail-foot .live i{width:5px;height:5px;background:currentColor;box-shadow:0 0 0 3px var(--ok-bg)}
.rail-foot .sp{margin-left:auto}

/* ── 中栏 ───────────────────────────────────────────────────────────────── */
.stage{min-width:0;display:flex;flex-direction:column;background:var(--paper);position:relative}
.stage-scroll{flex:1;min-height:0;overflow:auto;padding:20px 26px 26px}
.crumb{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);text-transform:uppercase}
.crumb b{color:var(--ink-2);font-weight:500}
.crumb .sl{opacity:.45}

.head{margin-top:12px;display:flex;align-items:flex-start;gap:20px}
.head-copy{min-width:0;flex:1}
.state{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.state i{width:5px;height:5px;background:currentColor;box-shadow:0 0 0 3px var(--accent-bg);animation:pulse 2s var(--ease) infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px transparent}}
.state .tick{color:var(--ink-3);letter-spacing:.06em;text-transform:none}
.state--ok{color:var(--ok)}
.state--ok i{box-shadow:0 0 0 3px var(--ok-bg);animation:none}
.state--warn{color:var(--warn)}
.state--warn i{box-shadow:0 0 0 3px var(--warn-bg);animation:none}
.state--idle{color:var(--ink-3)}
.state--idle i{background:currentColor;box-shadow:none;animation:none}
h1{margin-top:8px;font-size:26px;line-height:1.22;font-weight:600;letter-spacing:-.028em}
h1 .lead{color:var(--ink-3);font-weight:400}
.sub{margin-top:9px;font-size:13px;line-height:1.65;color:var(--ink-2);max-width:54ch}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;padding-top:2px;min-width:112px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:32px;padding:0 12px;
  border-radius:var(--r-sm);border:1px solid var(--rule);color:var(--ink);font-size:12.5px;white-space:nowrap;
  transition:background .16s var(--ease),border-color .16s var(--ease),color .16s var(--ease),opacity .16s var(--ease)}
.btn:hover{background:var(--sel)}
.btn--solid{background:var(--inv-bg);border-color:var(--inv-bg);color:var(--inv-ink);font-weight:600}
.btn--solid:hover{background:var(--inv-bg);opacity:.88}
.btn--h34{height:34px;padding:0 14px}
.btn--quiet{border-color:transparent;color:var(--ink-2)}
.btn--quiet:hover{color:var(--ink);background:var(--sel)}
.btn--danger{color:var(--err);border-color:color-mix(in srgb,var(--err) 38%,transparent)}
.btn--danger:hover{background:var(--err-bg)}
.btn--solid.btn--danger{background:var(--err-bg);border-color:color-mix(in srgb,var(--err) 48%,transparent);color:var(--err)}
.btn[disabled]{opacity:.42;cursor:not-allowed}
.btn[disabled]:hover{background:none}
.btn .spin{width:12px;height:12px;border:1.5px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.facts{margin-top:18px;display:flex;flex-wrap:wrap;gap:0 20px;padding:10px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.fact{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:11px}
.fact .k{color:var(--ink-3);letter-spacing:.04em}
.fact .v{color:var(--ink)}
.fact .v.acc{color:var(--accent)}

/* 章节：编号 + 名称 + 发丝线 */
.sec{display:flex;align-items:center;gap:10px;margin:22px 0 10px}
.sec .num{font-family:var(--mono);font-size:10.5px;color:var(--accent);letter-spacing:.04em}
.sec .name{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.sec .line{flex:1;height:1px;background:var(--rule)}
.sec .aside{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.sec .aside button{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border-bottom:1px solid var(--rule);padding-bottom:1px}
.sec .aside button:hover{color:var(--ink);border-color:var(--ink-3)}

/* 终端 */
.term{background:var(--shell);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);margin:0 -26px;padding:11px 0 13px}
.term-bar{display:flex;align-items:center;gap:8px;padding:0 26px 9px;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.term-bar b{color:var(--ink-2);font-weight:500}
.term-bar .sp{margin-left:auto}
.term-bar .clock{color:var(--ink-2)}
.log{font-family:var(--mono);font-size:11.5px;line-height:1.72;position:relative}
.lrow{display:grid;grid-template-columns:34px 16px minmax(0,1fr);gap:8px;padding:0 26px}
.lrow .ln{color:var(--ink-3);text-align:right;opacity:.65}
.lrow .gd{color:var(--ink-3)}
.lrow .msg{color:var(--ink-2);overflow-wrap:anywhere}
.lrow--user .msg{color:var(--user)}
.lrow--user .gd{color:var(--user);opacity:.7}
.lrow--tool .msg{color:var(--tool)}
.lrow--warn .msg{color:var(--warn)}
.lrow--err .msg{color:var(--err)}
.lrow .dim{color:var(--ink-3)}
.cur{display:inline-block;width:6px;height:11px;background:var(--accent);vertical-align:-1px;margin-left:2px;animation:blink 1.15s steps(2,start) infinite}
@keyframes blink{50%{opacity:0}}

/* 文件行 */
.files{border-top:1px solid var(--rule)}
.frow{display:grid;grid-template-columns:14px minmax(0,1fr) 54px 74px;gap:10px;align-items:center;
  padding:8px 2px;border-bottom:1px solid var(--rule-2);font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.frow:last-child{border-bottom:0}
.frow .st{color:var(--ok);font-size:10.5px;text-align:center}
.frow .st.a{color:var(--accent)}
.frow .st.d{color:var(--err)}
.frow .p{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .p .dir{color:var(--ink-3)}
.dbar{display:flex;height:3px;gap:1px;width:54px}
.dbar i{display:block;height:100%}
.dbar .a{background:var(--add)}
.dbar .d{background:var(--del)}
.frow .num{text-align:right;display:flex;justify-content:flex-end;gap:8px}
.frow .num .add{color:var(--add)}
.frow .num .del{color:var(--del)}

/* 验收 */
.checks{display:grid;grid-template-columns:1fr 1fr;gap:2px 18px;padding-top:2px}
.chk{display:flex;align-items:flex-start;gap:8px;padding:6px 0;font-size:12.5px;color:var(--ink-2);text-align:left;width:100%}
.chk .bx{width:12px;height:12px;flex:none;margin-top:3px;border:1px solid var(--rule);display:grid;place-items:center;transition:.16s var(--ease)}
.chk .bx svg{fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.chk.done .bx{border-color:var(--ink);background:var(--ink)}
.chk.done .bx svg{width:9px;height:9px;color:var(--paper)}
.chk.done span{color:var(--ink)}
.chk.pend .bx{border-style:dashed;border-color:var(--ink-3)}
.chk:hover .bx{border-color:var(--ink-2)}

/* 键值列表（中栏） */
.kvs{border-top:1px solid var(--rule)}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr) auto;gap:12px;align-items:baseline;
  padding:7px 2px;border-bottom:1px solid var(--rule-2);font-size:12px}
.kv .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.kv .v{font-family:var(--mono);font-size:11.5px;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kv .v.dim{color:var(--ink-3)}

/* 行内操作 */
.rowacts{display:flex;flex-wrap:wrap;gap:6px;padding-top:12px}

/* 横幅 */
.banner{display:flex;align-items:flex-start;gap:9px;padding:9px 11px;border-left:2px solid var(--rule);
  background:var(--sel);font-size:12.5px;line-height:1.55;color:var(--ink-2)}
.banner .ico{margin-top:2px;color:var(--ink-3)}
.banner b{color:var(--ink);font-weight:600}
.banner--warn{border-left-color:var(--warn);background:var(--warn-bg)}
.banner--warn .ico{color:var(--warn)}
.banner--err{border-left-color:var(--err);background:var(--err-bg)}
.banner--err .ico{color:var(--err)}
.banner--ok{border-left-color:var(--ok);background:var(--ok-bg)}
.banner--ok .ico{color:var(--ok)}
.banner .lnk{color:var(--ink);border-bottom:1px solid var(--rule)}
.banner + .banner{margin-top:6px}

/* 统计（项目概览） */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.stat{padding:12px 14px 13px;border-left:1px solid var(--rule-2)}
.stat:first-child{border-left:0;padding-left:2px}
.stat .n{font-family:var(--mono);font-size:22px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .n.acc{color:var(--accent)}
.stat .l{margin-top:4px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}

/* ── 右栏 ───────────────────────────────────────────────────────────────── */
.insp{border-left:1px solid var(--rule);background:var(--shell);display:flex;flex-direction:column;min-height:0}
.insp-scroll{flex:1;min-height:0;overflow:auto;padding:16px 14px 18px}
.ititle{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);display:flex;align-items:center;gap:8px;margin-bottom:9px}
.ititle .line{flex:1;height:1px;background:var(--rule-2)}
.isec{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--rule-2)}
.isec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.ld{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:11px;padding:3.5px 0}
.ld .k{color:var(--ink-3);white-space:nowrap}
.ld .d{flex:1;border-bottom:1px dotted var(--rule);transform:translateY(-3px);min-width:8px}
.ld .v{color:var(--ink);white-space:nowrap;max-width:132px;overflow:hidden;text-overflow:ellipsis}
.ld .v.acc{color:var(--accent)}
.ld .v.ok{color:var(--ok)}
.ld .v.warn{color:var(--warn)}
.ld .v.err{color:var(--err)}
.ld .v.dim{color:var(--ink-3)}
.ld--stack{display:grid;grid-template-columns:1fr;gap:1px;padding:5px 0}
.ld--stack .v{max-width:none;overflow:visible;font-size:10.5px;color:var(--ink-2);word-break:break-all}

.ilist{display:flex;flex-direction:column;gap:1px}
.ilist button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 6px;border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink-2);transition:.16s var(--ease)}
.ilist button:hover{background:var(--sel);color:var(--ink)}
.ilist button .ic{color:var(--ink-3)}
.ilist button .ar{margin-left:auto;color:var(--ink-3);opacity:0;transition:.16s var(--ease)}
.ilist button:hover .ar{opacity:1}
.ilist button.danger{color:var(--err)}
.ilist button.danger .ic{color:var(--err)}
.ilist button.danger:hover{background:var(--err-bg)}
.ilist button[disabled]{opacity:.4;cursor:not-allowed}
.ilist button[disabled]:hover{background:none;color:var(--ink-2)}

.meter{margin-top:4px}
.meter .track{height:3px;background:var(--rule-2);overflow:hidden}
.meter .fill{height:100%;background:var(--ink-2)}
.meter .cap{display:flex;justify-content:space-between;margin-top:5px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* ── 表单 ───────────────────────────────────────────────────────────────── */
.form{display:grid;gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field > .lb{display:flex;align-items:baseline;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.field > .lb .req{color:var(--accent)}
.field > .hint{font-size:11.5px;line-height:1.5;color:var(--ink-3)}
.inp{height:32px;padding:0 10px;width:100%;background:transparent;border:1px solid var(--rule);border-radius:var(--r-sm);
  font-size:12.5px;color:var(--ink);outline:none;transition:border-color .16s var(--ease),background .16s var(--ease)}
.inp:hover{border-color:var(--ink-3)}
.inp:focus{border-color:var(--accent);background:var(--sel)}
.inp::placeholder{color:var(--ink-3)}
.inp.mono{font-family:var(--mono);font-size:11.5px}
textarea.inp{height:auto;min-height:74px;padding:8px 10px;line-height:1.6;resize:vertical}
.inp-row{display:flex;gap:6px}
.inp-row .inp{flex:1;min-width:0}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.seg button{height:30px;padding:0 14px;font-size:12px;color:var(--ink-3);border-left:1px solid var(--rule-2)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--sel);color:var(--ink)}
.field-inline{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;align-items:end}

/* ── 弹窗 ───────────────────────────────────────────────────────────────── */
.scrim{position:absolute;inset:0;background:var(--scrim);display:grid;place-items:center;padding:24px;z-index:40;
  animation:fade .16s var(--ease)}
@keyframes fade{from{opacity:0}}
.modal{width:520px;max-width:100%;max-height:calc(100% - 8px);background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r-md);box-shadow:var(--lift);display:grid;grid-template-rows:auto minmax(0,1fr) auto;overflow:hidden;
  animation:rise .18s var(--ease)}
@keyframes rise{from{transform:translateY(6px);opacity:.6}}
.modal--lg{width:620px}
.modal--sm{width:430px}
.modal--danger{border-color:color-mix(in srgb,var(--err) 34%,transparent)}
.modal-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 14px 18px;border-bottom:1px solid var(--rule)}
.modal-head .ic{color:var(--ink-3);margin-top:2px}
.modal--danger .modal-head .ic{color:var(--err)}
.modal-head .tt{flex:1;min-width:0}
.modal-head h2{font-size:15.5px;font-weight:600;letter-spacing:-.01em;line-height:1.35}
.modal-head .st{margin-top:3px;font-size:12px;color:var(--ink-3);line-height:1.5}
.modal-head .x{width:24px;height:24px;display:grid;place-items:center;border-radius:4px;color:var(--ink-3);flex:none}
.modal-head .x:hover{background:var(--sel);color:var(--ink)}
.modal-body{padding:16px 18px;overflow:auto;display:grid;gap:14px;min-height:0}
.modal-foot{display:flex;align-items:center;gap:8px;padding:12px 16px 12px 18px;border-top:1px solid var(--rule);background:var(--shell)}
.modal-foot .sp{flex:1}
.modal-foot .note{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* 危险列表 */
.dlist{border-top:1px solid var(--rule)}
.dlist .dh{font-size:12px;color:var(--ink-2);padding:8px 0 6px}
.dlist .dr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--rule-2);font-family:var(--mono);font-size:11.5px;color:var(--ink)}
.dlist .dr .ic{color:var(--err);opacity:.8}
.dlist .dr .mut{color:var(--ink-3);margin-left:auto;font-size:10.5px}
.dlist .dr .chip{margin-left:auto}

/* diff 预览 */
.patch{margin:0;background:var(--shell);border:1px solid var(--rule);border-radius:var(--r-sm);padding:10px 12px;
  font-family:var(--mono);font-size:11px;line-height:1.7;color:var(--ink-2);max-height:300px;overflow:auto;white-space:pre}
.patch .a{color:var(--add)}
.patch .d{color:var(--del)}
.patch .h{color:var(--ink-3)}

/* 复选行 */
.opt{display:flex;align-items:flex-start;gap:9px;font-size:12.5px;color:var(--ink-2);cursor:pointer;padding:2px 0}
.opt input{appearance:none;width:13px;height:13px;flex:none;margin:2px 0 0;border:1px solid var(--rule);border-radius:2px;
  background:transparent;cursor:pointer;position:relative}
.opt input:checked{border-color:var(--ink);background:var(--ink)}
.opt input:checked::after{content:"";position:absolute;left:3.5px;top:1px;width:4px;height:7px;
  border-right:1.6px solid var(--paper);border-bottom:1.6px solid var(--paper);transform:rotate(40deg)}
.opt input:disabled{opacity:.4;cursor:not-allowed}
.opt b{color:var(--ink);font-weight:500}
.opt .d{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px;line-height:1.5}

/* ── 菜单 / toast / 空态 / 骨架 ─────────────────────────────────────────── */
.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:186px;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r-sm);box-shadow:var(--lift);padding:4px;z-index:30;animation:rise .14s var(--ease)}
.menu button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 8px;border-radius:3px;font-size:12.5px;color:var(--ink-2)}
.menu button:hover{background:var(--sel);color:var(--ink)}
.menu button .ic{color:var(--ink-3)}
.menu button.danger{color:var(--err)}
.menu button.danger .ic{color:var(--err)}
.menu .hr{height:1px;background:var(--rule-2);margin:4px 2px}

.toasts{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:60;align-items:flex-end}
.toast{display:flex;align-items:center;gap:8px;padding:8px 11px;background:var(--paper);border:1px solid var(--rule);
  border-left:2px solid var(--accent);border-radius:var(--r-sm);box-shadow:var(--lift);font-size:12.5px;color:var(--ink);
  animation:rise .16s var(--ease)}
.toast .ic{color:var(--ok)}
.toast--err{border-left-color:var(--err)}
.toast--err .ic{color:var(--err)}

.empty{display:grid;place-items:center;gap:10px;padding:56px 20px;text-align:center}
.empty .ic{width:26px;height:26px;color:var(--ink-3);opacity:.7}
.empty h3{font-size:14px;font-weight:600}
.empty p{font-size:12.5px;color:var(--ink-3);max-width:34ch;line-height:1.6}
.empty .btn{margin-top:4px}

.skel{display:grid;gap:10px;padding:4px 0}
.skel i{display:block;height:11px;background:var(--rule-2);animation:sk 1.4s var(--ease) infinite}
.skel i:nth-child(2){width:72%}
.skel i:nth-child(3){width:88%}
@keyframes sk{50%{opacity:.45}}

.chip{display:inline-flex;align-items:center;gap:4px;padding:1px 5px;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--mono);font-size:10px;letter-spacing:.04em;color:var(--ink-3);white-space:nowrap}
.chip--warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.chip--err{color:var(--err);border-color:color-mix(in srgb,var(--err) 40%,transparent)}
.chip--ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.chip--acc{color:var(--accent);border-color:var(--accent-line)}

/* 设置页列表 */
.slist{border-top:1px solid var(--rule)}
.srow{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 2px;
  border-bottom:1px solid var(--rule-2);font-size:12.5px}
.srow .ic{color:var(--ink-3)}
.srow .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2)}
.srow .ops{display:flex;gap:2px;opacity:0;transition:.14s var(--ease)}
.srow:hover .ops,.srow:focus-within .ops{opacity:1}
.srow .ops button{width:22px;height:22px;display:grid;place-items:center;border-radius:3px;color:var(--ink-3)}
.srow .ops button:hover{background:var(--sel);color:var(--ink)}
.srow .ops button.danger:hover{background:var(--err-bg);color:var(--err)}
.srow.edit{grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:6px 0}

.drawer-line{height:1px;background:var(--rule);margin:14px 0}
.tiny{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
.dot-i{width:5px;height:5px;display:inline-block;background:currentColor;vertical-align:1px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1000px){
  .frame{grid-template-columns:198px minmax(0,1fr)}
  .insp{display:none}
  .stage-scroll{padding:18px 20px}.term{margin:0 -20px}.term-bar,.lrow{padding-left:20px;padding-right:20px}
}
@media (max-width:720px){
  .frame{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  h1{font-size:21px}
  .checks,.stats{grid-template-columns:1fr 1fr}
  .modal--lg{width:100%}
}
</style>
</head>

<script>
/* ── 状态 ───────────────────────────────────────────────────────────────── */
const S = {
  view: { type:'task', id:'t1' },
  q: '', filter:'all', showArchived:false, collapsed:{}, theme:'dark',
  crit: DATA.criteria.slice(),
  recents: DATA.recents.slice(),
  chk: {},              // 任务验收勾选状态覆盖
  saving: false, saved: false,
  editingCrit: -1,
  state: 'normal'        // normal | offline | empty（预览用）
};
const STATUS = {
  ready:{label:'待开始', cls:'idle', dot:''},
  developing:{label:'运行中', cls:'', dot:'run'},
  review:{label:'待验收', cls:'warn', dot:'warn'},
  merged:{label:'已合并', cls:'ok', dot:'ok'},
  broken:{label:'异常', cls:'', dot:'err'}
};
const task = id => DATA.tasks.find(t => t.id === id);
const proj = id => DATA.projects.find(p => p.id === id);
const projTasks = pid => DATA.tasks.filter(t => t.p === pid);
const icon = (n, cls='ico') => '<svg class="'+cls+'"><use href="#i-'+n+'"/></svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function tasksOf(pid){
  const q = S.q.trim().toLowerCase();
  return projTasks(pid).filter(t => {
    if (!S.showArchived && t.archived) return false;
    if (S.filter === 'active' && t.status !== 'developing') return false;
    if (S.filter === 'review' && t.status !== 'review') return false;
    if (!q) return true;
    const hay = [t.title, t.branch, t.desc, STATUS[t.status].label, proj(t.p).name].join(' ').toLowerCase();
    return hay.includes(q);
  });
}
function countActive(){ return DATA.tasks.filter(t => !t.archived && t.status === 'developing').length }
function countReview(){ return DATA.tasks.filter(t => !t.archived && t.status === 'review').length }
function countAll(){ return DATA.tasks.filter(t => !t.archived).length }

/* ── 左栏 ───────────────────────────────────────────────────────────────── */
function renderFilters(){
  if (S.state !== 'normal'){ const f=document.getElementById('filters'); f.innerHTML=''; f.style.display='none'; return }
  document.getElementById('filters').style.display='';
  const f = [['all','全部',countAll()],['active','进行中',countActive()],['review','待验收',countReview()]];
  document.getElementById('filters').innerHTML = f.map(([k,label,n]) =>
    '<button data-act="filter:'+k+'" aria-pressed="'+(S.filter===k)+'">'+label+'<span class="n">'+n+'</span></button>'
  ).join('');
}
function renderTree(){
  const treeEl = document.getElementById('tree');
  if (S.state === 'offline'){
    treeEl.innerHTML = '<div class="reconnect"><span class="spin"></span>重新连接中…<button class="btn" data-act="refresh">重试</button></div>'+
      '<div class="railed">'+icon('alert','ico')+'<h3>加载失败</h3><p>连接已断开，请重试，或从 DSH 启动地址重新打开工作台。</p></div>';
    const lv = document.querySelector('.rail-foot .live');
    lv.classList.add('off');
    lv.innerHTML = '<span class="slot"><i></i></span>会话离线';
    document.getElementById('filters').innerHTML = '';
    document.getElementById('foot-stat').textContent = '—';
    return;
  }
  document.querySelector('.rail-foot .live').classList.remove('off');
  if (S.state === 'empty'){
    treeEl.innerHTML = '<div class="railed">'+icon('repo','ico')+'<h3>暂无项目</h3><p>选择一个 Git 仓库，开始发布 worktree 任务。</p>'+
      '<button class="btn" data-act="add-project">新增项目</button></div>';
    document.getElementById('foot-stat').textContent = '0 个项目 · 0 个任务';
    return;
  }
  const q = S.q.trim().toLowerCase();
  const groups = DATA.projects.map(p => ({ p, ts: tasksOf(p.id) })).filter(g => g.ts.length || (!q && S.filter==='all'));
  document.getElementById('tree').innerHTML = groups.map(({p,ts}) => {
    const open = q ? true : (S.collapsed[p.id] ? false : true);
    const total = ts.length;
    return '<div class="grp-wrap">'+
      '<div class="grp" aria-expanded="'+open+'">'+
        '<button class="caret-btn" title="展开 / 折叠" aria-label="展开或折叠：'+esc(p.name)+'" data-act="collapse:'+p.id+'"><svg class="caret" viewBox="0 0 16 16"><path d="M4 6.5 8 11l4-4.5"/></svg></button>'+
        '<button class="pname" data-act="project:'+p.id+'" title="'+esc(p.path)+'">'+esc(p.name)+'</button>'+
        '<span class="n">'+total+'</span>'+
        '<button class="add" title="发布任务" aria-label="发布任务：'+esc(p.name)+'" data-act="publish:'+p.id+'">'+icon('plus','ico ico-sm')+'</button>'+
      '</div>'+
      (open ? ts.map(t => {
        const st = STATUS[t.status];
        const cur = S.view.type==='task' && S.view.id===t.id;
        return '<button class="trow" aria-current="'+(cur?'true':'false')+'" title="'+esc(t.title)+'" data-act="task:'+t.id+'">'+
          '<span class="mark"><i class="'+st.dot+'"></i></span>'+
          '<span>'+
            '<span class="tt">'+esc(t.title)+'</span>'+
            '<span class="tm"><span class="b">'+esc(t.branch)+'</span>'+
              '<span class="plus">'+(t.dirty>0?'±'+t.dirty:(t.ahead>0?'↑'+t.ahead:''))+'</span>'+
              '<span class="t'+(t.timeAcc?' acc':'')+'">'+esc(t.time)+'</span></span>'+
          '</span></button>';
      }).join('') : (open && !ts.length ? '<div class="tiny" style="padding:6px 12px 10px calc(12px + 16px + 6px)">暂无任务 · <button data-act="publish:'+p.id+'" style="color:var(--ink-2);border-bottom:1px solid var(--rule)">发布任务</button></div>' : ''))+
    '</div>';
  }).join('') || emptyTree();
  document.getElementById('foot-stat').textContent = DATA.projects.length+' 个项目 · '+countAll()+' 个任务';
}
function emptyTree(){
  const q = S.q.trim();
  return '<div class="empty" style="padding-top:40px">'+icon('search','ico')+
    '<h3>'+(q?'没有匹配的项目':'暂无项目')+'</h3>'+
    '<p>'+(q?'换个关键词，或清除搜索查看全部项目。':'选择一个 Git 仓库，开始发布 worktree 任务。')+'</p>'+
    '<button class="btn" data-act="'+(q?'clear-search':'add-project')+'">'+(q?'清除搜索':'新增项目')+'</button></div>';
}
function renderStrip(){
  const t = S.view.type==='task' ? task(S.view.id) : null;
  const p = t ? proj(t.p) : (S.view.type==='project' ? proj(S.view.id) : null);
  if (S.state !== 'normal'){ document.getElementById('strip-proj').innerHTML = '<span class="br">'+(S.state==='offline'?'离线':'未选择项目')+'</span>'; return }
  document.getElementById('strip-proj').innerHTML = p
    ? icon('repo','ico ico-sm')+'<span>'+esc(p.name)+'</span>'+(t?'<span class="br">'+esc(t.branch)+'</span>':'')
    : '<span class="br">设置</span>';
  document.getElementById('nav-settings').setAttribute('aria-current', S.view.type==='settings' ? 'page' : 'false');
}

/* ── 任务详情 ───────────────────────────────────────────────────────────── */
function termHTML(t){
  const log = t.log || DATA.log;
  const rows = log.map(([kind,gd,msg],i) =>
      '<div class="lrow'+(kind?' lrow--'+kind:'')+'"><span class="ln">'+String(i+1).padStart(2,'0')+'</span><span class="gd">'+gd+'</span><span class="msg">'+esc(msg)+'</span></div>'
    ).join('') +
    '<div class="lrow"><span class="ln">'+String(log.length+1).padStart(2,'0')+'</span><span class="gd">›</span><span class="msg">整理中<span class="cur"></span></span></div>';
  return '<div class="term">'+
    '<div class="term-bar"><b>dshw-'+esc(t.branch.replace(/\//g,'-'))+'</b><span class="sp"></span>'+
      '<span class="clock">4m 12s</span><span>·</span><span>18.2k tok</span></div>'+
    '<div class="log">'+rows+'</div></div>';
}
function checksHTML(t){
  return '<div class="checks">'+t.crit.map(([label,done],i) => {
    const key = t.id+':'+i;
    const on = key in S.chk ? S.chk[key] : done;
    return '<button class="chk '+(on?'done':'pend')+'" data-act="chk:'+key+'">'+
      '<span class="bx">'+(on?'<svg viewBox="0 0 16 16"><use href="#i-check"/></svg>':'')+'</span>'+
      '<span>'+esc(label)+'</span></button>';
  }).join('')+'</div>';
}
function fileStats(t){
  const f = t.files || [];
  const a = f.reduce((n,x)=>n+x[3],0), d = f.reduce((n,x)=>n+x[4],0);
  return f.length ? f.length+' files · +'+a+' −'+d : '无改动';
}
function filesHTML(t){
  const files = t.files || [];
  if (!files.length) return '<div class="banner">'+icon('info')+'<div>还没有改动。</div></div>';
  const max = Math.max(...files.map(f => Math.max(f[3], f[4])), 1);
  return '<div class="files">'+files.map(([st,dir,name,a,d]) =>
    '<div class="frow"><span class="st '+(st==='A'?'a':(st==='D'?'d':''))+'">'+st+'</span>'+
    '<span class="p" title="'+esc(dir+name)+'"><span class="dir">'+dir+'</span>'+name+'</span>'+
    '<span class="dbar">'+
      (a?'<i class="a" style="width:'+Math.round(a/max*34)+'px"></i>':'')+
      (d?'<i class="d" style="width:'+Math.round(d/max*14)+'px"></i>':'')+'</span>'+
    '<span class="num">'+(a?'<span class="add">+'+a+'</span>':'')+(d?'<span class="del">−'+d+'</span>':'')+'</span></div>'
  ).join('')+'</div>';
}
function viewTask(t){
  const p = proj(t.p), st = STATUS[t.status];
  const pending = t.pending ? '<span class="chip chip--warn">'+t.pending+'</span>' : '';
  const archived = t.archived ? '<span class="chip">已归档</span>' : '';

  const heads = {
    developing:{ cls:'', label:'RUNNING', cta:'<button class="btn btn--solid btn--h34" data-act="open-session">进入会话'+icon('play','ico ico-sm')+'</button>' },
    review:{ cls:'warn', label:'待验收', cta:'<button class="btn btn--solid btn--h34" data-act="review-approve">处理审批'+icon('play','ico ico-sm')+'</button><button class="btn" data-act="open-session">进入会话</button>' },
    merged:{ cls:'ok', label:'已合并', cta:'<button class="btn btn--h34" data-act="open-cleanup">清理 worktree'+icon('trash','ico ico-sm')+'</button>' },
    ready:{ cls:'idle', label:'待开始', cta:'<button class="btn btn--solid btn--h34" data-act="start-session">启动会话'+icon('play','ico ico-sm')+'</button>' },
    broken:{ cls:'', label:'会话异常', cta:'<button class="btn btn--solid btn--h34" data-act="open-session">进入会话</button><button class="btn" data-act="restart-session">重开会话</button>' }
  }[t.status];

  const banner = t.status==='review'
    ? '<div class="banner banner--warn">'+icon('alert')+'<div><b>会话停在审批点。</b>批准后继续执行，或先查看改动再决定。</div></div>'
    : t.status==='broken'
    ? '<div class="banner banner--err">'+icon('alert')+'<div><b>上一轮被中断。</b>会话状态与工作区可能不一致，重开前建议先看改动。</div></div>'
    : t.status==='merged' && t.ahead>0
    ? '<div class="banner banner--warn">'+icon('alert')+'<div><b>合并后分支又有提交。</b>继续做请基于已合并成果新建任务。</div></div>'
    : '';

  const sessionSec = t.session === false
    ? '<div class="sec"><span class="num">01</span><span class="name">会话</span><span class="line"></span><span class="aside">未创建</span></div>'+
      '<div class="banner">'+icon('info')+'<div>这个任务还没有会话，启动后会绑定一个 worktree 会话。</div></div>'
    : '<div class="sec"><span class="num">01</span><span class="name">会话</span><span class="line"></span><span class="aside">'+t.turns+' 轮 · 8 次调用</span></div>'+termHTML(t);

  const reviewActs = t.status==='developing' || t.status==='review'
    ? '<div class="rowacts">'+
        '<button class="btn" data-act="open-merge">'+icon('merge','ico ico-sm')+'合并回基线</button>'+
        '<button class="btn" data-act="open-stash">'+icon('stash','ico ico-sm')+'查看暂存内容</button>'+
        '<button class="btn" data-act="open-sync">'+icon('wand','ico ico-sm')+'让 Agent 同步基线</button>'+
        '<button class="btn" data-act="open-switch">'+icon('ext','ico ico-sm')+'切到任务分支验收</button>'+
      '</div>' : '';

  return '<div class="stage-scroll">'+
    '<div class="crumb">'+icon('folder','ico ico-sm')+'<b>'+esc(p.name)+'</b><span class="sl">/</span>任务<span class="sl">/</span>'+esc(t.branch)+'</div>'+
    '<div class="head"><div class="head-copy">'+
      '<div class="state state--'+st.cls+'"><i></i>'+heads.label+'<span class="tick">4m12s</span></div>'+
      '<h1><span class="lead">'+esc(t.lead)+'</span> '+esc(t.title)+'</h1>'+
      '<p class="sub">'+esc(t.desc)+'</p>'+
    '</div><div class="acts">'+heads.cta+'</div></div>'+
    (pending||archived ? '<div class="rowacts" style="padding-top:10px">'+pending+archived+'</div>' : '')+
    '<div class="facts">'+
      '<span class="fact"><span class="k">base</span><span class="v">'+esc(p.base)+' @ 74decac</span></span>'+
      '<span class="fact"><span class="k">ahead</span><span class="v acc">'+t.ahead+'</span></span>'+
      '<span class="fact"><span class="k">dirty</span><span class="v'+(t.dirty?' acc':'')+'">'+t.dirty+'</span></span>'+
      '<span class="fact"><span class="k">model</span><span class="v">'+esc(t.model||'—')+'</span></span>'+
      '<span class="fact"><span class="k">turns</span><span class="v">'+t.turns+'</span></span>'+
    '</div>'+
    banner+
    sessionSec+
    '<div class="sec"><span class="num">02</span><span class="name">改动</span><span class="line"></span><span class="aside">'+fileStats(t)+'</span></div>'+filesHTML(t)+
    '<div class="sec"><span class="num">03</span><span class="name">验收</span><span class="line"></span><span class="aside">'+t.crit.filter(([,d])=>d).length+' / '+t.crit.length+'</span></div>'+
    checksHTML(t)+reviewActs+
    (t.status==='merged' ? '<div class="sec"><span class="num">04</span><span class="name">关系</span><span class="line"></span><span class="aside">已合并</span></div>'+
      '<div class="kvs"><div class="kv"><span class="k">merged into</span><span class="v">'+esc(p.base)+' · no-ff</span><span></span></div>'+
      '<div class="kv"><span class="k">predecessor</span><span class="v dim">—</span><span></span></div></div>' : '')+
    '<div class="sec"><span class="num">'+(t.status==='merged'?'05':'04')+'</span><span class="name">归档与危险操作</span><span class="line"></span></div>'+
    '<div class="rowacts" style="padding-top:0">'+
      '<button class="btn" data-act="archive:'+t.id+'">'+icon('archive','ico ico-sm')+(t.archived?'取消归档':'归档')+'</button>'+
      (t.status==='merged' ? '<button class="btn" data-act="open-publish-continue">'+icon('play','ico ico-sm')+'基于此任务继续</button>' : '')+
      (t.status!=='ready' ? '<button class="btn" data-act="open-cleanup">'+icon('trash','ico ico-sm')+'清理 worktree</button>' : '')+
      '<button class="btn" data-act="open-cleanup-prev">清理前序 worktree</button>'+
      '<button class="btn btn--danger" data-act="open-delete-task">'+icon('trash','ico ico-sm')+'删除记录</button>'+
    '</div>'+
  '</div>';
}

/* ── 项目详情 ───────────────────────────────────────────────────────────── */
function viewProject(p){
  const ts = projTasks(p.id);
  const attention = ts.filter(t => t.status==='review' || t.status==='broken').length;
  const active = ts.filter(t => t.status==='developing').length;
  const review = ts.filter(t => t.status==='review').length;
  const merged = ts.filter(t => t.status==='merged').length;
  return '<div class="stage-scroll">'+
    '<div class="crumb">'+icon('folder','ico ico-sm')+'项目<span class="sl">/</span>'+esc(p.name)+'</div>'+
    '<div class="head"><div class="head-copy">'+
      '<h1 style="margin-top:10px">'+esc(p.name)+'</h1>'+
      '<div style="margin-top:8px;display:flex;align-items:center;gap:8px;min-width:0">'+
        '<span class="tiny" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(p.path)+'</span>'+
        '<button class="strip-btn" style="width:20px;height:20px" title="复制仓库路径" data-act="copy:'+esc(p.path)+'">'+icon('copy','ico ico-sm')+'</button>'+
        '<span class="tiny">· '+ts.length+' 个任务</span>'+

      '<p>添加一个 Git 仓库后，可以为它发布基于 worktree 的任务，并在同一个看板里跟踪进度、验收与合并。</p>'+
      '<button class="btn btn--solid" data-act="add-project">新增项目</button></div></div>';

      r.style.display = !v || txt.includes(v) ? '' : 'none';
    });
  });
}

    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid" data-act="submit" data-msg="指令已发送">发送</button>'
  }),
  'cleanup': (ctx) => {
    const t = task((ctx && ctx.tid) || (S.view.type==='task' ? S.view.id : 't1')) || task('t1');
    const wt = proj(t.p).dir + '/' + t.branch.replace(/\//g,'-');
    return {
    title:'清理 worktree', sub:'清理指定的 worktree 及其相关文件。', icon:'trash', tone:'danger', size:'sm',
    body:'<div class="dlist"><div class="dh">以下内容将被永久删除，且无法恢复：</div>'+
      '<div class="dr">'+icon('folder','ico ico-sm')+'<span>'+esc(wt)+'</span></div>'+
      '<div class="dr">'+icon('file','ico ico-sm')+'<span>'+(t.dirty ? t.dirty+' 个未提交改动会一并丢失' : '工作区干净，没有未提交改动')+'</span></div></div>'+
      '<div class="form"><label class="opt"><input type="checkbox"'+(t.dirty?'':' disabled')+'><span><b>强制</b><span class="d">即使存在未提交的改动也执行清理。</span></span></label>'+
      '<label class="opt"><input type="checkbox"><span><b>同时删除分支</b><span class="d">清理完成后，一并删除对应的本地分支。</span></span></label></div>',
    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid btn--danger" data-act="submit" data-msg="worktree 已清理">清理 worktree</button>'
    }
  },
  'delete-task': (ctx) => {
    const t = task((ctx && ctx.tid) || (S.view.type==='task' ? S.view.id : 't1')) || task('t1');
    return {
    title:'删除任务记录', sub:t.title, icon:'trash', tone:'danger', size:'sm',
    body:'<div class="banner banner--err">'+icon('alert')+'<div><b>此操作不可撤销。</b>任务记录会从看板移除，但 worktree 与分支不会被删除。</div></div>'+
      '<div class="kvs" style="border-top:0">'+kv('分支',t.branch)+kv('Worktree',proj(t.p).dir+'/'+t.branch.replace(/\//g,'-'))+kv('状态',STATUS[t.status].label)+'</div>'+
      '<p class="tiny" style="line-height:1.7">如果还需要保留代码，请先合并，再删除记录。</p>',
    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid btn--danger" data-act="submit" data-msg="任务记录已删除">删除记录</button>'
    }
  },
  'delete-project': () => ({
    title:'删除项目', sub:'dsh-worktree', icon:'trash', tone:'danger', size:'sm',
    body:'<div class="banner banner--warn">'+icon('alert')+'<div><b>项目下还有 4 条任务记录。</b>需要同时删除这些任务记录才能移除项目。</div></div>'+
      '<div class="kvs" style="border-top:0">'+kv('仓库路径','~/Projects/dsh-worktree')+kv('任务记录','4 个任务')+kv('默认基线','main')+'</div>'+
      '<div class="form"><label class="opt"><input type="checkbox" checked><span><b>连同任务一起删除</b></span></label>'+
      '<label class="opt"><input type="checkbox"><span><b>同时删除 worktree 文件夹</b><span class="d">强制删除磁盘上的 worktree 目录，未提交的改动会一并丢失。</span></span></label></div>',
    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid btn--danger" data-act="submit" data-msg="项目「dsh-worktree」已删除">删除项目</button>'
  }),
  'cleanup-prev': () => ({
    title:'清理前序任务的 worktree', sub:'前序任务已合并，可以清理它的 worktree 以释放空间。', icon:'trash', tone:'danger', size:'sm',
    body:'<div class="dlist"><div class="dh">将删除：</div>'+
      '<div class="dr">'+icon('folder','ico ico-sm')+'<span>.dsh-worktrees/fix-publish-chain</span></div></div>'+
      '<p class="tiny" style="line-height:1.7">只删除 worktree 目录，不删除分支和已有提交。</p>'+
      '<label class="opt"><input type="checkbox"><span><b>强制清理</b><span class="d">前序 worktree 有 2 处未提交改动，强制清理会丢失这些改动。</span></span></label>',
    foot:'<button class="btn" data-act="close-modal">保留</button><button class="btn btn--solid btn--danger" data-act="submit" data-msg="前序 worktree 已清理">清理 worktree</button>'
  }),
  'clear-recents': () => ({
    title:'清空最近目录', sub:'将从设置页移除最近使用的仓库目录。', icon:'trash', tone:'danger', size:'sm',
    body:'<div class="dlist"><div class="dh">以下 '+S.recents.length+' 个目录会从列表移除：</div>'+
      S.recents.map(r=>'<div class="dr">'+icon('folder','ico ico-sm')+'<span>'+esc(r)+'</span></div>').join('')+'</div>'+
      '<p class="tiny" style="line-height:1.7">磁盘上的目录和仓库不会被删除，只清空这份列表。</p>',
    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid btn--danger" data-act="submit" data-msg="已清空最近目录" data-clear-recents="1">清空最近目录</button>'
  }),
  'switch': () => ({
    title:'切到任务分支验收', sub:'主仓库有未提交改动，直接切换会被 Git 拒绝。', icon:'alert', tone:'warn', size:'sm',
    body:'<p class="tiny" style="line-height:1.7">以下 3 个文件会阻止切换，请选择处理方式：</p>'+
      '<div class="dlist">'+
        '<div class="dr"><span>src/client/styles.ts</span><span class="mut">M</span></div>'+
        '<div class="dr"><span>docs/plan.md</span><span class="mut">M</span></div>'+
        '<div class="dr"><span>tmp/notes.txt</span><span class="chip">未跟踪</span></div>'+
      '</div>',
    foot:'<button class="btn" data-act="close-modal">取消</button><button class="btn btn--solid" data-act="submit" data-msg="已暂存并切换">暂存后切换</button>'+
      '<button class="btn btn--danger" data-act="submit" data-msg="已放弃改动并切换">放弃改动后切换</button>'
  })
};

let busy = false;
function openModal(key, ctx){
  const m = MODALS[key](ctx || {});
  const ov = document.getElementById('overlay');
  ov.innerHTML = '<div class="scrim" data-scrim>'+
    '<div class="modal'+(m.size==='lg'?' modal--lg':m.size==='sm'?' modal--sm':'')+(m.tone==='danger'?' modal--danger':'')+'" role="dialog" aria-modal="true" aria-label="'+esc(m.title)+'">'+
      '<div class="modal-head">'+icon(m.icon)+'<div class="tt"><h2>'+esc(m.title)+'</h2>'+(m.sub?'<div class="st">'+esc(m.sub)+'</div>':'')+'</div>'+
        '<button class="x" aria-label="关闭" data-act="close-modal">'+icon('x','ico ico-sm')+'</button></div>'+
      '<div class="modal-body">'+m.body+'</div>'+
      '<div class="modal-foot"><span class="sp"></span>'+m.foot+'</div>'+
    '</div></div>';
  const f = ov.querySelector('input:not([type=checkbox]),textarea');
  if (f) setTimeout(()=>f.focus(), 30);
  ov.querySelector('[data-scrim]').addEventListener('mousedown', e => { if (e.target.hasAttribute('data-scrim')) closeModal() });
}
function closeModal(){ if (busy) return; document.getElementById('overlay').innerHTML = '' }
function toast(msg, kind){
  const t = document.createElement('div');
  t.className = 'toast' + (kind==='err'?' toast--err':'');
  t.innerHTML = icon(kind==='err'?'alert':'check','ico ico-sm')+'<span>'+esc(msg)+'</span>';
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

/* ── 事件 ───────────────────────────────────────────────────────────────── */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) { ['pmenu','smenu'].forEach(id => { const m=document.getElementById(id); if (m && !e.target.closest('.menu-wrap')) m.hidden = true }); return }
  const act = el.dataset.act;
  const [head, arg] = act.split(':');

  if (head === 'task') { go({type:'task', id:arg}); return }
  if (head === 'project') { go({type:'project', id:arg}); return }
  if (head === 'filter') { S.filter = arg; render(); return }
  if (head === 'collapse') { S.collapsed[arg] = !S.collapsed[arg]; renderTree(); return }
  if (head === 'chk') { S.chk[arg] = !(S.chk[arg] ?? true); render(); return }
  if (head === 'copy') { toast('已复制'); return }
  if (head === 'state') {
    S.state = arg;
    const m = document.getElementById('smenu'); if (m) m.hidden = true;
    if (arg === 'empty') S.view = { type:'empty' };
    else if (S.view.type === 'empty') S.view = { type:'task', id:'t1' };
    render(); return
  }
  if (head === 'archive') { const t = task(arg); t.archived = !t.archived; render(); toast(t.archived?'已归档':'已取消归档'); return }
  if (head === 'crit-add') {
    const i = document.getElementById('crit-new');
    if (!i.value.trim()) return;
    S.crit.push(i.value.trim()); i.value=''; render(); toast('已添加验收标准'); return
  }
  if (head === 'crit-edit') { S.editingCrit = +arg; render(); const f=document.querySelector('[data-edit]'); if(f) f.focus(); return }
  if (head === 'crit-cancel') { S.editingCrit = -1; render(); return }
  if (head === 'crit-save') {
    const f = document.querySelector('[data-edit]');
    if (f && f.value.trim()) S.crit[+arg] = f.value.trim();
    S.editingCrit = -1; render(); toast('已保存'); return
  }
  if (head === 'crit-del') { S.crit.splice(+arg,1); S.editingCrit=-1; render(); toast('已移除'); return }
  if (head === 'crit-up') { const i=+arg; if(i>0){ [S.crit[i-1],S.crit[i]]=[S.crit[i],S.crit[i-1]]; render() } return }
  if (head === 'crit-down') { const i=+arg; if(i<S.crit.length-1){ [S.crit[i+1],S.crit[i]]=[S.crit[i],S.crit[i+1]]; render() } return }

  switch (act) {
    case 'settings': go({type:'settings'}); break;
    case 'add-project': openModal('add-project'); break;
    case 'publish': openModal('publish', { pid: arg || (S.view.type==='project'?S.view.id:DATA.projects[0].id) }); break;
    case 'open-publish-continue': openModal('publish', { pid:'p1', mode:'continue' }); break;
    case 'open-merge': openModal('merge'); break;
    case 'open-stash': openModal('stash'); break;
    case 'open-sync': openModal('sync'); break;
    case 'open-cleanup': openModal('cleanup'); break;
    case 'open-cleanup-prev': openModal('cleanup-prev'); break;
    case 'open-delete-task': openModal('delete-task'); break;
    case 'open-delete-project': openModal('delete-project'); break;
    case 'open-clear-recents': openModal('clear-recents'); break;
    case 'open-switch': openModal('switch'); break;
    case 'close-modal': closeModal(); break;
    case 'clear-search': S.q=''; document.getElementById('q').value=''; render(); break;
    case 'refresh': toast('已刷新任务状态'); break;
    case 'archived': S.showArchived = !S.showArchived; el.setAttribute('aria-pressed', String(S.showArchived)); renderTree(); break;
    case 'menu': { const m=document.getElementById('pmenu'); if(m) m.hidden = !m.hidden; break }
    case 'smenu': { const m=document.getElementById('smenu'); if(m) m.hidden = !m.hidden; break }
    case 'save-project': S.saving=true; S.saved=false; render(); setTimeout(()=>{S.saving=false;S.saved=true;render();toast('已保存')},700); break;
    case 'open-session': toast('已打开会话'); break;
    case 'start-session': { const t=task(S.view.id); t.session=true; t.status='developing'; t.mark='run'; render(); toast('会话已启动'); break }
    case 'restart-session': { const t=task(S.view.id); t.status='developing'; t.mark='run'; render(); toast('会话已重开'); break }
    case 'review-approve': { const t=task(S.view.id); t.status='developing'; t.pending=null; t.mark='run'; render(); toast('已批准，继续执行'); break }
    case 'submit': {
      const msg = el.dataset.msg || '已完成';
      busy = true;
      const old = el.innerHTML;
      el.innerHTML = '<span class="spin"></span>处理中';
      el.disabled = true;
      setTimeout(() => {
        busy = false;
        if (el.dataset.clearRecents) S.recents = [];
        closeModal();
        if (msg.includes('已合并')) { const t=task(S.view.id); if(t){ t.status='merged'; t.mark='ok'; } }
        if (msg.includes('已清理')) { const t=task(S.view.id); if(t){ t.status='merged'; } }
        if (msg.includes('已删除')) { const t=task(S.view.id); if(t && t.status!=='merged'){ t.status='broken'; } }
        render(); toast(msg);
        el.innerHTML = old; el.disabled = false;
      }, 700);
      break
    }
  }
});
document.getElementById('q').addEventListener('input', e => { S.q = e.target.value; renderTree() });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { const m=document.getElementById('pmenu'); if (m && !m.hidden) { m.hidden=true; return } closeModal() }
});
function setTheme(t){
  S.theme = t;
  document.documentElement.dataset.theme = t;
  document.getElementById('tg-dark').setAttribute('aria-pressed', String(t==='dark'));
  document.getElementById('tg-light').setAttribute('aria-pressed', String(t==='light'));
}
render();
</script>
